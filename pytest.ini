[pytest]
# `legacy/` preserves the pre-rewrite code and its tests for provenance only
# (see legacy/README.md: "superseded and should not be cited"). Those tests
# assert the OLD contract -- pair-level splits, the meta-ensemble's fixed-weight
# fusion -- which the current code deliberately replaced. Collecting them would
# create pressure to change live code to satisfy retired expectations, so the
# default run covers the active suite.
#
# To run them deliberately:  pytest legacy/tests
testpaths = tests
