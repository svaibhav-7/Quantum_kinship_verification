name: TSKinFace pair protocol tests

on:
  push:
    branches:
      - main
      - fix/tskinface-negative-pair-protocol
  pull_request:
    paths:
      - "src/ts_pairs.py"
      - "src/run_metadata.py"
      - "scripts/evaluation/**"
      - "tests/test_tskinface_negatives.py"
      - ".github/workflows/tskinface-pair-tests.yml"

jobs:
  tskinface-pair-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run TSKinFace pair protocol tests
        run: python -m pytest tests/test_tskinface_negatives.py -q
