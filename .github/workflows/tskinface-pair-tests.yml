name: Active test suite

on:
  push:
    branches:
      - main
      - fix/tskinface-negative-pair-protocol
  pull_request:
    paths:
      - "src/ts_pairs.py"
      - "src/run_metadata.py"
      - "src/**"
      - "scripts/evaluation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tskinface-pair-tests.yml"

jobs:
  active-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run active test suite
        run: python -m pytest tests -q
